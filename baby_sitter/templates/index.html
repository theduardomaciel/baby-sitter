<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Baby Sitter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script>
        window.BABY_SITTER_CONFIG = {
            videoUrl: {{ video_url | tojson }},
        motionEventsUrl: { { motion_events_url | tojson } },
        motionSoundIntervalMs: { { motion_sound_interval_ms | tojson } },
        };
    </script>
    <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>

<body>
    <main class="stage">
        <img class="feed" src="{{ video_url }}" alt="Transmissão da câmera em tempo real">
        <div id="motion-overlay" class="motion-overlay"></div>
        <div id="status" class="status">Aguardando movimento</div>
        <div class="controls">
            <button id="sound-toggle" class="toggle active" type="button">Som: ligado</button>
        </div>
    </main>
</body>

</html>
