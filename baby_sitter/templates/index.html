<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Baby Sitter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script>
        window.BABY_SITTER_CONFIG = {
            videoUrl: {{ video_url | tojson }},
        motionEventsUrl: { { motion_events_url | tojson } },
        motionSoundIntervalMs: { { motion_sound_interval_ms | tojson } },
        };
    </script>
    <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>

<body>
    <main class="stage">
        <img class="feed" src="{{ video_url }}" alt="Transmissão da câmera em tempo real">
        <div id="motion-overlay" class="motion-overlay"></div>
        <div id="status" class="status">Aguardando movimento</div>
        <div class="controls">
            <button id="sound-toggle" class="toggle active" type="button">Som: ligado</button>
        </div>
        <section class="qr-card" aria-label="Acesso rápido à interface web">
            <div class="qr-card__text">
                <p class="qr-card__eyebrow">Acesso web</p>
                <h1>Abra no celular</h1>
                <p class="qr-card__description">Escaneie o QR Code para abrir esta página em outro dispositivo na mesma
                    rede.</p>
                <a class="qr-card__link" href="{{ public_url }}" target="_blank" rel="noreferrer">{{ public_url }}</a>
            </div>
            <img class="qr-card__image" src="{{ qr_code_data_url }}" alt="QR Code para abrir a página do Baby Sitter">
        </section>
    </main>
</body>

</html>
