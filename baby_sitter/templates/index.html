<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Baby Sitter</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #050000;
            --panel: rgba(12, 0, 0, 0.42);
            --text: #fff5f5;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 40, 40, 0.18), transparent 40%),
                linear-gradient(180deg, #0a0000 0%, var(--bg) 100%);
            font-family: Arial, Helvetica, sans-serif;
        }

        .stage {
            position: fixed;
            inset: 0;
            background: #000;
        }

        .feed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000;
        }

        .motion-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transform: scale(1);
            transform-origin: center;
            transition: opacity 160ms ease;
            background: radial-gradient(circle at center, rgba(255, 0, 0, 0) 60%, rgba(255, 35, 35, 0.06) 72%, rgba(255, 35, 35, 0.18) 84%, rgba(255, 35, 35, 0.48) 100%);
            filter: blur(12px) saturate(1.45);
            mix-blend-mode: screen;
        }

        .motion-overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255, 60, 60, 0) 64%, rgba(255, 60, 60, 0.18) 80%, rgba(255, 60, 60, 0.5) 100%);
            animation: pulse 1.1s ease-in-out infinite;
        }

        .motion-overlay.active {
            opacity: 1;
        }

        .status {
            position: absolute;
            left: 18px;
            top: 18px;
            padding: 10px 14px;
            border-radius: 999px;
            color: var(--text);
            background: var(--panel);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 14px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            z-index: 2;
        }

        .status.active {
            border-color: rgba(255, 90, 90, 0.42);
            box-shadow: 0 0 30px rgba(255, 35, 35, 0.24);
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.68;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        @media (max-width: 700px) {
            .status {
                left: 12px;
                top: 12px;
                padding: 8px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <main class="stage">
        <img class="feed" src="{{ video_url }}" alt="Transmissão da câmera em tempo real">
        <div id="motion-overlay" class="motion-overlay"></div>
        <div id="status" class="status">Aguardando movimento</div>
    </main>

    <script>
        const overlay = document.getElementById('motion-overlay');
        const status = document.getElementById('status');

        async function refreshMotionState() {
            try {
                const response = await fetch('{{ motion_status_url }}', { cache: 'no-store' });
                const data = await response.json();
                const active = Boolean(data.active);

                overlay.classList.toggle('active', active);
                status.classList.toggle('active', active);
                status.textContent = active ? 'Movimento detectado' : 'Aguardando movimento';
            } catch (error) {
                status.textContent = 'Câmera indisponível';
                overlay.classList.remove('active');
                status.classList.remove('active');
            } finally {
                setTimeout(refreshMotionState, 200);
            }
        }

        refreshMotionState();
    </script>
</body>

</html>
